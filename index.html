<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 7 - JavaScript</title>
    <!-- Vinculación de Bootstrap 5 vía CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="container py-4">
    <h1 class="mb-4">Práctica 7: Introducción a JavaScript</h1>

    <section class="card mb-4 p-4" id="sec-variables">
        <h2>a) Variables y salida</h2>
        <button id="btnDatos" class="btn btn-primary mt-2">Mostrar mis datos</button>
        <p id="parDatos" class="mt-3 fw-bold"></p>
    </section>

    <section class="card mb-4 p-4" id="sec-calcs">
        <h2>b) Calculadora de calificaciones</h2>
        <div class="row g-2 mt-1 mb-3">
            <div class="col"><input type="number" id="p1" class="form-control" placeholder="Parcial 1"></div>
            <div class="col"><input type="number" id="p2" class="form-control" placeholder="Parcial 2"></div>
            <div class="col"><input type="number" id="p3" class="form-control" placeholder="Parcial 3"></div>
        </div>
        <button id="btnCalc" class="btn btn-success">Calcular promedio</button>
        <p id="parCalc" class="mt-3 fw-bold"></p>
    </section>

    <section class="card mb-4 p-4" id="sec-lista">
        <h2>c) Lista dinámica</h2>
        <div class="input-group mb-3 mt-2">
            <input type="text" id="inputItem" class="form-control" placeholder="Nuevo elemento">
            <button id="btnAgregar" class="btn btn-primary">Agregar</button>
            <button id="btnLimpiar" class="btn btn-danger">Limpiar</button>
        </div>
        <ul id="milista" class="list-group"></ul>
    </section>

    <section class="card mb-4 p-4" id="sec-estilos">
        <h2>d) Cambio de estilos</h2>
        <p>Cambia el color de fondo de esta sección:</p>
        <div>
            <button class="btn btn-warning me-2" onclick="cambiarFondo('#fff3cd')">Amarillo</button>
            <button class="btn btn-info me-2" onclick="cambiarFondo('#d1ecf1')">Azul</button>
            <button class="btn btn-success me-2" onclick="cambiarFondo('#d4edda')">Verde</button>
            <button class="btn btn-secondary" onclick="cambiarFondo('')">Restaurar</button>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
